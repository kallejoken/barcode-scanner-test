# =====================================================================
#  Barcode-Scanner für ESPHome (SmartHome-yourself) – Teststand 2.3
#
#  Ablauf: GM60 liest EAN per UART -> Prüfziffer-Check -> Open Food Facts
#  -> (falls nichts gefunden) ean-suche.net -> (optional) OpengtinDB
#  -> Sensoren in Home Assistant + Eintrag auf der To-do-/Einkaufsliste.
#  Nichts gefunden: die EAN selbst wird eingetragen, langer Piep.
#
#  Display (SSD1306) ist optional: packages/display.yaml zusätzlich einbinden.
#  Alle Werte unter "substitutions" können in der eigenen Geräte-YAML
#  überschrieben werden.
# =====================================================================

substitutions:
  # Gerätename (Hostname) und Anzeigename in Home Assistant
  name: "barcode-scanner"
  friendly_name: "Barcode Scanner"

  # GM60-Scanner (UART, Sicht des ESP: TX -> Scanner-RX, RX -> Scanner-TX).
  # GPIO9/10 entsprechen der Original-Platine. Die Compile-Warnung
  # "might already be used by the flash interface" ist dort bekannt.
  uart_tx_pin: GPIO9
  uart_rx_pin: GPIO10
  # GM60 ab Werk meist 9600 Baud, manche Module sind auf 57600 eingestellt.
  uart_baud_rate: "9600"

  # Aktiver Piezo-Buzzer
  beeper_pin: GPIO16

  # Optionales OLED (nur relevant mit packages/display.yaml)
  display_i2c_sda: GPIO21
  display_i2c_scl: GPIO22
  ssd1306_i2c_address: "0x3C"

  # Open Food Facts verlangt einen User-Agent mit Kontakt-Mail:
  # "AppName/Version (deine-mail@example.com)" – bitte eigene Mail eintragen.
  http_user_agent: "BarcodeScannerESPHome/2.3 (deine-mail@example.com)"

  # To-do-Liste in Home Assistant, auf die gescannte Produkte kommen.
  # Leer lassen ("") = nichts eintragen, nur Sensoren.
  shopping_list_entity: "todo.shopping_list"

  # Optional: eigene OpengtinDB-QueryID (https://opengtindb.org/userid.php).
  # Leer = OpengtinDB wird nicht abgefragt.
  opengtindb_queryid: ""

  # Gleiche EAN innerhalb dieser Zeit (ms) nur einmal verarbeiten
  ean_debounce_ms: "3000"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  # false, damit der ESPHome Device Builder das Gerät findet und den
  # Online-Status anzeigt (Hostname = ${name}, ohne MAC-Anhang).
  name_add_mac_suffix: false
  min_version: "2026.10.0"
  project:
    name: smarthomeyourself.barcodescanner
    version: "2.3"
  on_boot:
    then:
      - text_sensor.template.publish:
          id: last_ean
          state: "Scan Barcode"

esp32:
  board: wemos_d1_mini32
  framework:
    type: esp-idf

logger:
  hardware_uart: UART0
  logs:
    # Die HTTP-Komponente meldet jede Antwort außer 2xx als [E] – auch ein
    # harmloses 404 "Produkt nicht gefunden". Darum hier stumm geschaltet;
    # die Abfragen unten loggen Ergebnis und echte Fehler selbst.
    http_request: NONE

api:
  actions:
    # Zum Testen ohne Scanner: in HA "ESPHome: barcode_scanner_request_ean"
    - action: request_ean
      variables:
        eancode: string
      then:
        - script.execute:
            id: request_ean
            raw: !lambda return eancode;

ota:
  - platform: esphome

wifi:
  # WLAN-Daten kommen aus der eigenen Geräte-YAML (!secret) oder dem Web-Installer.
  # Ohne WLAN startet ein Hotspot zur Einrichtung.
  ap:
    password: "12345678"

captive_portal:

improv_serial:

# ---------------------------------------------------------------------

globals:
  - id: current_ean          # zuletzt gültig gescannte EAN
    type: std::string
  - id: scan_ok              # Ergebnis der Prüfung in request_ean
    type: bool
    initial_value: "false"
  - id: last_scan_ms
    type: uint32_t
    initial_value: "0"
  - id: last_invalid_log_ms
    type: uint32_t
    initial_value: "0"

text_sensor:
  - platform: template
    id: last_ean
    name: "EAN"
  - platform: template
    id: last_brand
    name: "Brand"
  - platform: template
    id: last_product
    name: "Product"

switch:
  - platform: gpio
    id: beeper
    name: "Buzzer"
    pin: "${beeper_pin}"

uart:
  id: uart_bus
  baud_rate: ${uart_baud_rate}
  tx_pin: "${uart_tx_pin}"
  rx_pin:
    number: "${uart_rx_pin}"
    mode:
      input: true
      pullup: true
  debug:
    # Der GM60 schickt jeden Barcode als Text, abgeschlossen mit CR (bzw. CRLF).
    direction: RX
    dummy_receiver: true
    after:
      delimiter: "\r"
      timeout: 250ms
      bytes: 32
    sequence:
      - lambda: id(request_ean).execute(std::string(bytes.begin(), bytes.end()));

http_request:
  id: http_request_data
  useragent: "${http_user_agent}"
  timeout: 10s
  watchdog_timeout: 30s
  follow_redirects: true
  redirect_limit: 3
  verify_ssl: true

script:
  # -------------------------------------------------------------------
  # 1) Scan prüfen: nur echte EAN/GTIN (8/12/13/14 Ziffern, Prüfziffer ok),
  #    keine Doppelscans, nur mit WLAN. Dann Abfrage starten.
  # -------------------------------------------------------------------
  - id: request_ean
    mode: restart
    parameters:
      raw: std::string
    then:
      - lambda: |-
          // Leerzeichen und CR/LF am Anfang/Ende entfernen
          const char *ws = " \t\r\n";
          const size_t b = raw.find_first_not_of(ws);
          const std::string s = (b == std::string::npos)
              ? "" : raw.substr(b, raw.find_last_not_of(ws) - b + 1);

          // Nur Ziffern, Länge 8/12/13/14
          bool ok = s.size() == 8 || s.size() == 12 || s.size() == 13 || s.size() == 14;
          for (char c : s) {
            if (c < '0' || c > '9') ok = false;
          }
          // Prüfziffer: von rechts Gewichte 3,1,3,1,... (ohne Prüfziffer)
          if (ok) {
            int sum = 0;
            for (size_t i = 0; i + 1 < s.size(); i++) {
              const size_t pos_from_right = s.size() - 1 - i;
              sum += (s[i] - '0') * ((pos_from_right % 2) ? 3 : 1);
            }
            ok = ((10 - sum % 10) % 10) == (s.back() - '0');
          }

          const uint32_t now = millis();
          id(scan_ok) = false;
          if (!ok) {
            // Rauschen auf der Leitung nicht im Sekundentakt loggen
            if (now - id(last_invalid_log_ms) >= 10000) {
              ESP_LOGW("scan", "Ungültiger Barcode ignoriert");
              id(last_invalid_log_ms) = now;
            }
          } else if (s == id(current_ean) && now - id(last_scan_ms) < ${ean_debounce_ms}) {
            ESP_LOGD("scan", "Doppelscan ignoriert: %s", s.c_str());
          } else {
            ESP_LOGI("scan", "EAN: %s", s.c_str());
            id(current_ean) = s;
            id(last_scan_ms) = now;
            id(scan_ok) = true;
          }
      - if:
          condition:
            lambda: return id(scan_ok);
          then:
            - if:
                condition:
                  wifi.connected:
                then:
                  - script.execute:
                      id: get_ean_data
                      ean: !lambda return id(current_ean);
                else:
                  - logger.log:
                      level: WARN
                      format: "Kein WLAN – Abfrage übersprungen"

  # -------------------------------------------------------------------
  # 2) Produkt suchen, anzeigen, auf die Liste setzen
  # -------------------------------------------------------------------
  - id: get_ean_data
    mode: restart
    parameters:
      ean: std::string
    then:
      - lambda: |-
          id(last_ean).publish_state(ean);
          id(last_brand).publish_state("");
          id(last_product).publish_state("");
      - switch.turn_on: beeper
      - delay: 50ms
      - switch.turn_off: beeper

      # --- Stufe 1: Open Food Facts (v3, deutsche Namen bevorzugt) ---
      - http_request.get:
          url: !lambda |-
            return "https://world.openfoodfacts.org/api/v3/product/" + ean +
                "?product_type=all&lc=de"
                "&fields=product_name_de,product_name,generic_name_de,generic_name,brands";
          request_headers:
            Accept: application/json
          capture_response: true
          max_response_buffer_size: 4096
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 404) {
                    ESP_LOGI("openfoodfacts", "Produkt nicht gefunden");
                    return;
                  }
                  if (response->status_code != 200) {
                    ESP_LOGW("openfoodfacts", "HTTP-Status %d", response->status_code);
                    return;
                  }
                  json::parse_json(body, [](JsonObject root) -> bool {
                    const std::string status = root["status"] | "";
                    JsonObject p = root["product"];
                    if (status != "success" || p.isNull()) {
                      ESP_LOGI("openfoodfacts", "Produkt nicht gefunden");
                      return false;
                    }
                    // Name: deutsch > Hauptsprache > allgemeine Bezeichnung
                    std::string name;
                    for (const char *key : {"product_name_de", "product_name", "generic_name_de", "generic_name"}) {
                      const std::string v = p[key] | "";
                      if (!v.empty()) {
                        name = v;
                        break;
                      }
                    }
                    if (name.empty()) {
                      ESP_LOGI("openfoodfacts", "Eintrag ohne Produktname");
                      return false;
                    }
                    // Marke: nur die erste aus "Marke A, Marke B"
                    std::string brand = p["brands"] | "";
                    brand = brand.substr(0, brand.find(','));
                    ESP_LOGI("openfoodfacts", "Gefunden: %s / %s", brand.c_str(), name.c_str());
                    id(last_product).publish_state(name);
                    id(last_brand).publish_state(brand);
                    return true;
                  });
          on_error:
            then:
              - logger.log:
                  level: WARN
                  format: "Open Food Facts nicht erreichbar"

      # --- Stufe 2: ean-suche.net (kostenlos, ca. 60 Abfragen/Stunde) ---
      - if:
          condition:
            lambda: return id(last_product).state.empty();
          then:
            - http_request.get:
                url: !lambda return "https://ean-suche.net/api/produkt/" + ean;
                request_headers:
                  Accept: application/json
                capture_response: true
                max_response_buffer_size: 2048
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 404) {
                          ESP_LOGI("eansuche", "Produkt nicht gefunden");
                          return;
                        }
                        if (response->status_code == 429) {
                          ESP_LOGW("eansuche", "Limit erreicht (60/Stunde)");
                          return;
                        }
                        if (response->status_code != 200) {
                          ESP_LOGW("eansuche", "HTTP-Status %d", response->status_code);
                          return;
                        }
                        json::parse_json(body, [](JsonObject root) -> bool {
                          const bool found = root["found"] | false;
                          const std::string name = root["product_name"] | "";
                          if (!found || name.empty()) {
                            ESP_LOGI("eansuche", "Produkt nicht gefunden");
                            return false;
                          }
                          // ean-suche.net liefert keine Marke
                          ESP_LOGI("eansuche", "Gefunden: %s", name.c_str());
                          id(last_product).publish_state(name);
                          return true;
                        });
                on_error:
                  then:
                    - logger.log:
                        level: WARN
                        format: "ean-suche.net nicht erreichbar"

      # --- Stufe 3 (optional): OpengtinDB, nur mit eigener QueryID ---
      - if:
          condition:
            lambda: return id(last_product).state.empty() && !std::string("${opengtindb_queryid}").empty();
          then:
            - http_request.get:
                url: !lambda |-
                  return "https://opengtindb.org/?ean=" + ean + "&cmd=query&queryid=${opengtindb_queryid}";
                capture_response: true
                max_response_buffer_size: 2048
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) {
                          ESP_LOGW("opengtindb", "HTTP-Status %d", response->status_code);
                          return;
                        }
                        // Antwort ist Text: "key=value" je Zeile
                        int error_code = -1;
                        std::string name, detailname, vendor;
                        size_t start = 0;
                        while (start < body.size()) {
                          size_t end = body.find('\n', start);
                          if (end == std::string::npos) end = body.size();
                          std::string line = body.substr(start, end - start);
                          start = end + 1;
                          if (!line.empty() && line.back() == '\r') line.pop_back();
                          const size_t eq = line.find('=');
                          if (eq == std::string::npos) continue;
                          const std::string key = line.substr(0, eq);
                          const std::string value = line.substr(eq + 1);
                          if (key == "error") error_code = atoi(value.c_str());
                          else if (key == "name" && name.empty()) name = value;
                          else if (key == "detailname" && detailname.empty()) detailname = value;
                          else if (key == "vendor" && vendor.empty()) vendor = value;
                        }
                        if (error_code == 1) {
                          ESP_LOGI("opengtindb", "Produkt nicht gefunden");
                          return;
                        }
                        if (error_code != 0) {
                          ESP_LOGW("opengtindb", "Fehlercode %d (5 = Limit, 13 = QueryID ungültig)", error_code);
                          return;
                        }
                        const std::string product = !detailname.empty() ? detailname : name;
                        if (product.empty()) {
                          ESP_LOGI("opengtindb", "Eintrag ohne Produktname");
                          return;
                        }
                        ESP_LOGI("opengtindb", "Gefunden: %s / %s", vendor.c_str(), product.c_str());
                        id(last_product).publish_state(product);
                        id(last_brand).publish_state(vendor);
                on_error:
                  then:
                    - logger.log:
                        level: WARN
                        format: "OpengtinDB nicht erreichbar"

      # --- Ergebnis: Piepen ---
      - if:
          condition:
            lambda: return id(last_product).state.empty();
          then:
            # Nichts gefunden: langer Piep, EAN wird eingetragen
            - logger.log:
                level: INFO
                format: "Kein Produktname gefunden – EAN wird eingetragen"
            - switch.turn_on: beeper
            - delay: 800ms
            - switch.turn_off: beeper
          else:
            - switch.turn_on: beeper
            - delay: 50ms
            - switch.turn_off: beeper

      # --- Auf die To-do-Liste in Home Assistant setzen ---
      # Voraussetzung in HA: Geräte-Optionen der ESPHome-Integration ->
      # "Dem Gerät erlauben, Home Assistant-Aktionen auszuführen" aktivieren.
      - if:
          condition:
            and:
              - lambda: return !std::string("${shopping_list_entity}").empty();
              - api.connected:
          then:
            - homeassistant.action:
                action: todo.add_item
                data:
                  entity_id: "${shopping_list_entity}"
                  item: !lambda |-
                    // "Marke Produkt", ohne Marke doppelt; nichts gefunden = EAN
                    const std::string product = id(last_product).state;
                    const std::string brand = id(last_brand).state;
                    if (product.empty()) return id(last_ean).state;
                    if (brand.empty() || product.find(brand) != std::string::npos) return product;
                    return brand + " " + product;

      # Anzeige nach 10 s zurücksetzen
      - delay: 10s
      - lambda: |-
          id(last_ean).publish_state("Scan Barcode");
          id(last_brand).publish_state("");
          id(last_product).publish_state("");
