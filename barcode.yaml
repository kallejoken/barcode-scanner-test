# =====================================================================
#  Barcode-Scanner für ESPHome (SmartHome-yourself) – v3.0 (HACS)
#
#  Der ESP32 ist nur noch der Scanner:
#    GM60 liest Code per UART -> Plausibilitätsprüfung + Doppelscan-Sperre
#    -> Event "esphome.barcode_scanned" an Home Assistant.
#  Die Integration "SHYS Barcode Scanner" (HACS) sucht das Produkt
#  (lokale Datenbank zuerst, dann Open Food Facts / ean-suche.net),
#  setzt es auf die To-do-Liste und meldet das Ergebnis per Aktion
#  "show_result" zurück (Anzeige + Piep).
#
#  Kein HTTP, kein JSON, keine API-Keys auf dem ESP. Ändert sich eine API,
#  reicht ein Update der HACS-Integration, der ESP muss nicht neu geflasht
#  werden.
#
#  Pflicht: genau EIN Buzzer-Paket einbinden
#    packages/buzzer-active.yaml   (aktiver Piezo, piept bei HIGH)
#    packages/buzzer-passive.yaml  (passiver Piezo, Töne per PWM/RTTTL)
#    packages/buzzer-none.yaml     (kein Buzzer verbaut)
#  Optional: packages/display.yaml (SSD1306 128x64 OLED)
# =====================================================================

substitutions:
  # Gerätename (Hostname) und Anzeigename in Home Assistant
  name: "barcode-scanner"
  friendly_name: "Barcode Scanner"

  # GM60-Scanner (UART, Sicht des ESP: TX -> Scanner-RX, RX -> Scanner-TX).
  # GPIO9/10 entsprechen der Original-Platine. Die Compile-Warnung
  # "might already be used by the flash interface" ist dort bekannt.
  uart_tx_pin: GPIO9
  uart_rx_pin: GPIO10
  # GM60 ab Werk meist 9600 Baud, manche Module sind auf 57600 eingestellt.
  uart_baud_rate: "9600"

  # Buzzer (aktiv oder passiv, je nach eingebundenem Paket)
  beeper_pin: GPIO16

  # I2C für das optionale OLED (nur relevant mit packages/display.yaml)
  i2c_sda_pin: GPIO21
  i2c_scl_pin: GPIO22
  ssd1306_i2c_address: "0x3C"

  # Gleichen Code innerhalb dieser Zeit (ms) nur einmal senden
  ean_debounce_ms: "3000"
  # Kommt in dieser Zeit (ms) keine Antwort von Home Assistant, Fehler-Piep
  result_timeout_ms: "25000"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  # false, damit der ESPHome Device Builder das Gerät findet und den
  # Online-Status anzeigt (Hostname = ${name}, ohne MAC-Anhang).
  name_add_mac_suffix: false
  min_version: "2026.10.0"
  project:
    name: smarthomeyourself.barcodescanner
    version: "3.0"
  on_boot:
    then:
      - script.execute: reset_display

esp32:
  board: wemos_d1_mini32
  framework:
    type: esp-idf

logger:
  hardware_uart: UART0

api:
  actions:
    # Ergebnis von Home Assistant (Integration "SHYS Barcode Scanner").
    # In HA: esphome.<name>_show_result, z. B. esphome.barcode_scanner_show_result
    # status: ok | unknown | duplicate | error
    - action: show_result
      variables:
        status: string
        ean: string
        brand: string
        product: string
      then:
        - script.stop: result_timeout
        - lambda: |-
            id(last_ean).publish_state(ean);
            id(last_brand).publish_state(brand);
            if (!product.empty()) {
              id(last_product).publish_state(product);
            } else if (status == "unknown") {
              id(last_product).publish_state("Unbekannt - bitte anlernen");
            } else if (status == "error") {
              id(last_product).publish_state("Fehler");
            } else {
              id(last_product).publish_state("");
            }
            id(last_status).publish_state(status);
        - if:
            condition:
              lambda: return status == "ok" || status == "duplicate";
            then:
              - script.execute: beep_ok
            else:
              - if:
                  condition:
                    lambda: return status == "unknown";
                  then:
                    - script.execute: beep_unknown
                  else:
                    - script.execute: beep_error
        - script.execute: reset_display_later

    # Zum Testen ohne Scanner: in HA "ESPHome: barcode_scanner_simulate_scan"
    - action: simulate_scan
      variables:
        code: string
      then:
        - script.execute:
            id: handle_scan
            raw: !lambda return code;

ota:
  - platform: esphome

wifi:
  # WLAN-Daten kommen aus der eigenen Geräte-YAML (!secret) oder dem Web-Installer.
  # Ohne WLAN startet ein Hotspot zur Einrichtung.
  ap:
    password: "12345678"

captive_portal:

improv_serial:

# ---------------------------------------------------------------------

globals:
  - id: last_code            # zuletzt gesendeter Code (Doppelscan-Sperre)
    type: std::string
  - id: last_scan_ms
    type: uint32_t
    initial_value: "0"
  - id: last_invalid_log_ms
    type: uint32_t
    initial_value: "0"

text_sensor:
  - platform: template
    id: last_ean
    name: "EAN"
  - platform: template
    id: last_brand
    name: "Brand"
  - platform: template
    id: last_product
    name: "Product"
  - platform: template
    id: last_status
    name: "Scan Status"
    entity_category: diagnostic

uart:
  id: uart_bus
  baud_rate: ${uart_baud_rate}
  tx_pin: "${uart_tx_pin}"
  rx_pin:
    number: "${uart_rx_pin}"
    mode:
      input: true
      pullup: true
  debug:
    # Der GM60 schickt jeden Barcode als Text, abgeschlossen mit CR (bzw. CRLF).
    direction: RX
    dummy_receiver: true
    after:
      delimiter: "\r"
      timeout: 250ms
      bytes: 64
    sequence:
      - lambda: id(handle_scan).execute(std::string(bytes.begin(), bytes.end()));

script:
  # -------------------------------------------------------------------
  # Scan prüfen und an Home Assistant schicken.
  # Erlaubt sind EAN/GTIN UND eigene Codes (QR/Sticker für die lokale
  # Datenbank): 4..32 druckbare ASCII-Zeichen, keine Steuerzeichen.
  # Die EAN-Prüfziffer prüft die HACS-Integration.
  # -------------------------------------------------------------------
  - id: handle_scan
    mode: queued
    max_runs: 3
    parameters:
      raw: std::string
    then:
      - lambda: |-
          // Leerzeichen und CR/LF am Anfang/Ende entfernen
          const char *ws = " \t\r\n";
          const size_t b = raw.find_first_not_of(ws);
          const std::string s = (b == std::string::npos)
              ? "" : raw.substr(b, raw.find_last_not_of(ws) - b + 1);

          bool ok = s.size() >= 4 && s.size() <= 32;
          for (char c : s) {
            if (c < 0x20 || c > 0x7E) ok = false;  // nur druckbares ASCII
          }

          const uint32_t now = millis();
          if (!ok) {
            // Rauschen auf der Leitung nicht im Sekundentakt loggen
            if (now - id(last_invalid_log_ms) >= 10000) {
              ESP_LOGW("scan", "Ungültigen Code ignoriert (%u Bytes)", (unsigned) s.size());
              id(last_invalid_log_ms) = now;
            }
            return;
          }
          if (s == id(last_code) && now - id(last_scan_ms) < ${ean_debounce_ms}) {
            ESP_LOGD("scan", "Doppelscan ignoriert: %s", s.c_str());
            return;
          }
          ESP_LOGI("scan", "Code: %s", s.c_str());
          id(last_code) = s;
          id(last_scan_ms) = now;
          id(send_scan).execute(s);

  - id: send_scan
    mode: restart
    parameters:
      code: std::string
    then:
      - script.stop: reset_display_later
      - lambda: |-
          id(last_ean).publish_state(code);
          id(last_brand).publish_state("");
          id(last_product).publish_state("Suche ...");
          id(last_status).publish_state("scanned");
      - if:
          condition:
            api.connected:
          then:
            # Events brauchen KEINE Freigabe "Aktionen ausführen" in HA
            - homeassistant.event:
                event: esphome.barcode_scanned
                data:
                  ean: !lambda return code;
                  device: "${name}"
            - script.execute: result_timeout
          else:
            - logger.log:
                level: WARN
                format: "Keine Verbindung zu Home Assistant – Scan nicht gesendet"
            - lambda: |-
                id(last_product).publish_state("Keine Verbindung zu HA");
                id(last_status).publish_state("error");
            - script.execute: beep_error
            - script.execute: reset_display_later

  # Keine Antwort von HA (Integration nicht installiert / Fehler)
  - id: result_timeout
    mode: restart
    then:
      - delay: ${result_timeout_ms}ms
      - logger.log:
          level: WARN
          format: "Keine Antwort von Home Assistant (Integration SHYS Barcode Scanner installiert?)"
      - lambda: |-
          id(last_product).publish_state("Keine Antwort von HA");
          id(last_status).publish_state("error");
      - script.execute: beep_error
      - script.execute: reset_display_later

  # Anzeige nach 10 s zurücksetzen
  - id: reset_display_later
    mode: restart
    then:
      - delay: 10s
      - script.execute: reset_display

  - id: reset_display
    then:
      - lambda: |-
          id(last_ean).publish_state("Scan Barcode");
          id(last_brand).publish_state("");
          id(last_product).publish_state("");
