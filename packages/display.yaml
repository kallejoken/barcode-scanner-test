# Optionales OLED-Package. Weglassen, wenn kein Display angeschlossen ist.
# Erwartetes Modul: SSD1306 128x64 I2C, Adresse 0x3C, SDA=GPIO21, SCL=GPIO22.
# Schrift: Google Fonts Roboto (wird beim Compilen geladen, kein arial.ttf nötig).

globals:
  - id: xpos_ean
    type: int
    initial_value: "0"
  - id: xpos_brand
    type: int
    initial_value: "0"
  - id: xpos_prod
    type: int
    initial_value: "0"

font:
  - file: "gfonts://Roboto"
    id: font_18
    size: 18
  - file: "gfonts://Roboto"
    id: font_20
    size: 20
    glyphs: 'ß!?"%()+*=,-_.:°ø0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZÄÜÖ abcdefghijklmnopqrstuvwxyzäüö€@<>/'

i2c:
  sda: "${display_i2c_sda}"
  scl: "${display_i2c_scl}"
  scan: false
  frequency: 400kHz
  id: i2c_bus

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: "${ssd1306_i2c_address}"
    update_interval: 250ms
    lambda: |-
      it.print(id(xpos_ean), 0, id(font_18), id(last_ean).state.c_str());
      it.print(id(xpos_brand), 19, id(font_20), id(last_brand).state.c_str());
      it.print(id(xpos_prod), 40, id(font_20), id(last_product).state.c_str());

      int x_start, y_start, height;
      int brand_width, prod_width, ean_width;
      it.get_text_bounds(0, 0, id(last_ean).state.c_str(), id(font_20), TextAlign::TOP_LEFT, &x_start, &y_start, &ean_width, &height);
      it.get_text_bounds(0, 0, id(last_brand).state.c_str(), id(font_20), TextAlign::TOP_LEFT, &x_start, &y_start, &brand_width, &height);
      it.get_text_bounds(0, 0, id(last_product).state.c_str(), id(font_20), TextAlign::TOP_LEFT, &x_start, &y_start, &prod_width, &height);

      if (id(xpos_ean) > (-1 * ean_width) - 30 && ean_width > 128) {
        id(xpos_ean) -= 10;
      } else {
        id(xpos_ean) = 0;
      }

      if (id(xpos_brand) > (-1 * brand_width) - 30 && brand_width > 128) {
        id(xpos_brand) -= 10;
      } else {
        id(xpos_brand) = 0;
      }

      if (id(xpos_prod) > (-1 * prod_width) - 30 && prod_width > 128) {
        id(xpos_prod) -= 10;
      } else {
        id(xpos_prod) = 0;
      }
